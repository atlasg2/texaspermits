name: Daily TABS monitor

# The EFFICIENT daily engine (scripts/daily_update.py, per docs/V1_BUILD.md §5):
# index-scan the active fiscal years via the TABS SearchProjects API (~455 cheap
# requests), diff status codes vs Supabase, and fetch the full detail page ONLY
# for new/changed projects — logging each status move to status_history. Finishes
# in minutes. (Supersedes the brute-force re-fetch in scripts/daily_scrape.sh,
# which re-pulled all 60k detail pages and timed out at 3h.) The site (Vercel)
# reads Supabase, so it updates on its own.
#
# REQUIRED secret: DATABASE_URL  (Supabase IPv4 Session Pooler connection string,
# same value as DATABASE_URL in the local .env). Add at:
#   repo > Settings > Secrets and variables > Actions > New repository secret.

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC daily (~6am Central) — after overnight, before business hours
  workflow_dispatch:        # allow manual "Run workflow" from the Actions tab

# Never let two daily runs overlap (a slow run shouldn't collide with the next).
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run daily engine
        # 4 workers: the SearchProjects endpoint throttles higher concurrency.
        run: python3 scripts/daily_update.py --workers 4
